# Check that every commit in a pull request to a version branch names a
# ticket key and carries the base branch tag ("PS-11435 [8.4] ..."). The
# tag is what survives the upward null-merges (8.0 -> 8.4 -> 9.7 -> trunk)
# and what release tooling greps for, so a squash merged under a rewritten
# subject loses the change for both. Merge-style PRs (upstream merges, null
# merges) and PRs to non-version branches are skipped.
#
# Read-only: no secrets, the default token with read scopes, a GitHub-hosted
# runner. The PR title is passed through the environment, never interpolated
# into the shell.
#
# pull_request_target on purpose: the workflow and the script come from the
# base branch, so a PR cannot edit its own checker into a no-op. Nothing from
# the PR head is checked out or executed, only its metadata is read.

name: pr-commit-subjects

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] base-branch checkout only, no PR code runs
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read  # actions/checkout fetches the script from the PR merge ref
  pull-requests: read  # gh api lists the PR commits, also on fork PRs under pull_request

concurrency:
  group: pr-commit-subjects-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check PR title and commit subjects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}  # the base branch, never the PR head
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check PR title and commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-pr-commit-subjects.sh
